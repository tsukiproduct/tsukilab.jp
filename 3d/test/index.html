<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Window 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080d18;color:white;font:14px system-ui}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}#status{background:#101b2ad9;padding:9px 12px;border-radius:12px;flex:1}button{pointer-events:auto;border:0;border-radius:10px;padding:10px;background:#d9f5ff;color:#102235;font-weight:700}#hint{position:fixed;bottom:18px;left:12px;right:12px;text-align:center;color:#c8d8e5;font-size:12px;background:#101b2acc;padding:10px;border-radius:10px}video{display:none}</style></head><body><div id="hud"><div id="status">手動モード：画面をドラッグして視点移動</div><button id="start">顔追跡を開始</button></div><div id="hint">HTTPSで開いてカメラを許可してください。追跡できない場合は指でドラッグできます。</div><video id="video" autoplay muted playsinline></video><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101b2b');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,100);const room=new THREE.Group();scene.add(room);
function box(w,h,d,x,y,z,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);room.add(m);return m}
box(5,.15,6,0,-1.65,-2.6,'#526273');box(5,3.7,.12,0,.15,-5.6,'#28384b');box(.12,3.7,6,-2.5,.15,-2.6,'#34485d');box(.12,3.7,6,2.5,.15,-2.6,'#34485d');box(.25,3.7,.25,-2.25,.15,-.2,'#7790a1');box(.25,3.7,.25,2.25,.15,-.2,'#7790a1');box(1.1,.7,.8,-1.4,-1.22,-3.3,'#ab795e');box(.85,1.3,.75,1.55,-.95,-4.4,'#627b7d');box(1.1,.1,.7,0,-1.1,-2.2,'#c09366');
const char=new THREE.Group();room.add(char);char.position.set(0,-.85,-3.5);const skin=new THREE.MeshStandardMaterial({color:'#f1bd9d'}),coat=new THREE.MeshStandardMaterial({color:'#b58be3'}),hair=new THREE.MeshStandardMaterial({color:'#25223b'}),eye=new THREE.MeshStandardMaterial({color:'#172232'});
function part(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);char.add(m);return m}part(new THREE.CapsuleGeometry(.28,.65,6,12),coat,0,.15,0);part(new THREE.SphereGeometry(.34,24,16),skin,0,.86,0);part(new THREE.SphereGeometry(.35,24,16,0,Math.PI*2,0,Math.PI*.46),hair,0,1.02,0);for(const x of [-.12,.12])part(new THREE.SphereGeometry(.036,10,8),eye,x,.87,.316);for(const x of [-.37,.37]){const arm=part(new THREE.CapsuleGeometry(.095,.42,4,8),coat,x,.23,0);arm.rotation.z=x>0?-.25:.25}for(const x of [-.14,.14])part(new THREE.CapsuleGeometry(.11,.36,4,8),hair,x,-.49,0);
scene.add(new THREE.HemisphereLight('#d5ecff','#27334c',2));const light=new THREE.PointLight('#ffcb91',55,12);light.position.set(-1.2,1,-2.5);scene.add(light);
let targetX=0,targetY=0,targetZ=0,viewX=0,viewY=0,viewZ=0,tracking=false;const status=document.querySelector('#status');function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(!down||tracking)return;targetX=Math.max(-.75,Math.min(.75,targetX-(e.clientX-px)/innerWidth*2));targetY=Math.max(-.6,Math.min(.6,targetY+(e.clientY-py)/innerHeight*1.6));px=e.clientX;py=e.clientY});
function render(t){requestAnimationFrame(render);viewX+=(targetX-viewX)*.12;viewY+=(targetY-viewY)*.12;viewZ+=(targetZ-viewZ)*.08;const dist=4.6+viewZ;camera.position.set(viewX,viewY,dist);camera.rotation.set(0,0,0);const halfH=dist*Math.tan(48*Math.PI/360),halfW=halfH*camera.aspect;const near=camera.near;camera.projectionMatrix.makePerspective((-halfW-viewX)*near/dist,(halfW-viewX)*near/dist,(halfH-viewY)*near/dist,(-halfH-viewY)*near/dist,near,camera.far);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();char.rotation.y=Math.sin(t*.0006)*.1;renderer.render(scene,camera)}requestAnimationFrame(render);
document.querySelector('#start').onclick=async()=>{const btn=document.querySelector('#start');btn.disabled=true;status.textContent='カメラと顔追跡を準備中…';try{if(!window.isSecureContext)throw new Error('HTTPSが必要です');if(!navigator.mediaDevices?.getUserMedia)throw new Error('このブラウザではカメラAPIが利用できません');status.textContent='前面カメラの許可を待っています…';const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});const video=document.querySelector('#video');video.srcObject=stream;await video.play();status.textContent='カメラ起動成功。顔認識ライブラリを読み込み中…';const {FaceDetector,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');status.textContent='顔認識エンジンを準備中…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');status.textContent='顔認識モデルを読み込み中…';const detector=await FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},runningMode:'VIDEO',minDetectionConfidence:.5});tracking=true;btn.textContent='追跡中';let last=-1;function detect(){if(!tracking)return;if(video.readyState>=2&&video.currentTime!==last){last=video.currentTime;const r=detector.detectForVideo(video,performance.now());if(r.detections.length){const b=r.detections[0].boundingBox,cx=(b.originX+b.width/2)/video.videoWidth,cy=(b.originY+b.height/2)/video.videoHeight;targetX=Math.max(-.85,Math.min(.85,(.5-cx)*1.9));targetY=Math.max(-.65,Math.min(.65,(.5-cy)*1.4));targetZ=Math.max(-.6,Math.min(.8,(.28-b.width/video.videoWidth)*2));status.textContent='顔追跡中：頭を左右・上下に動かしてみて';}else status.textContent='顔を探しています…'}requestAnimationFrame(detect)}detect()}catch(err){tracking=false;btn.disabled=false;btn.textContent='再試行';status.textContent='エラー: '+(err?.name||'')+' '+(err?.message||String(err));console.error(err)}};
</script></body></html>
