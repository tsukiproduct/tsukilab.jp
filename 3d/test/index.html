<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Window 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080d18;color:white;font:14px system-ui}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}#status{background:#101b2ad9;padding:9px 12px;border-radius:12px;flex:1}button{pointer-events:auto;border:0;border-radius:10px;padding:10px;background:#d9f5ff;color:#102235;font-weight:700}#hint{position:fixed;bottom:18px;left:12px;right:12px;text-align:center;color:#c8d8e5;font-size:12px;background:#101b2acc;padding:10px;border-radius:10px}video{display:none}</style></head><body><div id="hud"><div id="status">手動モード：画面をドラッグして視点移動</div><button id="start">顔追跡を開始</button></div><div id="hint">明るい場所で正面を向いてください。映像は端末内で処理されます。追跡しないときは指で操作できます。</div><video id="video" autoplay muted playsinline></video><script src="./vendor/tracking-min.js"></script><script src="./vendor/face-min.js"></script><script type="module">

box(5,.15,6,0,-1.65,-2.6,'#526273');box(5,3.7,.12,0,.15,-5.6,'#28384b');box(.12,3.7,6,-2.5,.15,-2.6,'#34485d');box(.12,3.7,6,2.5,.15,-2.6,'#34485d');box(.25,3.7,.25,-2.25,.15,-.2,'#7790a1');box(.25,3.7,.25,2.25,.15,-.2,'#7790a1');box(1.1,.7,.8,-1.4,-1.22,-3.3,'#ab795e');box(.85,1.3,.75,1.55,-.95,-4.4,'#627b7d');box(1.1,.1,.7,0,-1.1,-2.2,'#c09366');
const char=new THREE.Group();room.add(char);char.position.set(0,-.85,-3.5);const skin=new THREE.MeshStandardMaterial({color:'#f1bd9d'}),coat=new THREE.MeshStandardMaterial({color:'#b58be3'}),hair=new THREE.MeshStandardMaterial({color:'#25223b'}),eye=new THREE.MeshStandardMaterial({color:'#172232'});

let targetX=0,targetY=0,targetZ=0,viewX=0,viewY=0,viewZ=0,tracking=false;const status=document.querySelector('#status');function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);

function render(t){requestAnimationFrame(render);viewX+=(targetX-viewX)*.12;viewY+=(targetY-viewY)*.12;viewZ+=(targetZ-viewZ)*.08;const dist=4.6+viewZ;camera.position.set(viewX,viewY,dist);camera.rotation.set(0,0,0);const halfH=dist*Math.tan(48*Math.PI/360),halfW=halfH*camera.aspect;const near=camera.near;camera.projectionMatrix.makePerspective((-halfW-viewX)*near/dist,(halfW-viewX)*near/dist,(halfH-viewY)*near/dist,(-halfH-viewY)*near/dist,near,camera.far);camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();char.rotation.y=Math.sin(t*.0006)*.1;renderer.render(scene,camera)}requestAnimationFrame(render);
const btn=document.querySelector('#start'), video=document.querySelector('#video');
let stream=null, timer=null;

 if(tracking){stopCamera();status.textContent='手動モード：画面をドラッグして視点移動';return}
 btn.disabled=true;
 try {
  if(!window.isSecureContext)throw new Error('HTTPSで開いてください');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Safariで開き、カメラを利用できるか確認してください');

  status.textContent='前面カメラの許可を待っています…';
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});

  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});

    if(video.readyState>=2 && video.videoWidth){
     canvas.width=160;canvas.height=Math.max(1,Math.round(160*video.videoHeight/video.videoWidth));

      const cx=(b.x+b.width/2)/canvas.width,cy=(b.y+b.height/2)/canvas.height;
      targetX=Math.max(-.85,Math.min(.85,(.5-cx)*1.9));targetY=Math.max(-.65,Math.min(.65,(.5-cy)*1.4));targetZ=Math.max(-.6,Math.min(.8,(.28-b.width/canvas.width)*2));

     }else status.textContent='顔を探しています… 明るい場所で正面を向いてください';
    }timer=setTimeout(detect,150);
   }catch(err){stopCamera();btn.textContent='再試行';status.textContent='顔認識エラー: '+(err.message||String(err));console.error(err)}
  }detect();
 }catch(err){stopCamera();btn.textContent='再試行';status.textContent='エラー: '+(err.message||String(err));console.error(err)}
};
