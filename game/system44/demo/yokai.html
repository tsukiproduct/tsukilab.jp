<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#121620"><title>妖怪絵巻 — YOKAI EMaki</title><style>@font-face{font-family:Bebas;src:url('./fonts/bebas-neue.ttf');font-display:swap}*{box-sizing:border-box}html,body{margin:0;background:#101419;color:#f3dec0;min-height:100%;font-family:Georgia,serif}main{max-width:1050px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;letter-spacing:.15em;padding:5px 0 10px}.top span{font:12px system-ui}canvas{display:block;width:100%;aspect-ratio:16/10;background:#23313e;border:3px solid #574733;touch-action:none}.touch{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.pad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,48px);gap:4px}.action{display:grid;grid-template-columns:repeat(2,80px);gap:5px}.touch button{background:#42352b;border:1px solid #b09a78;color:#f8e4c3;font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}.guide{font:12px/1.8 system-ui;color:#c8bcaa;margin-top:15px}.embedded body{overflow:hidden}.embedded main{padding:0;max-width:none;width:100vw;height:100vh}.embedded .top,.embedded .touch,.embedded .guide{display:none}.embedded canvas{width:100vw;height:100vh;aspect-ratio:auto;border:0}@media(min-width:701px) and (pointer:fine){.touch{display:none}}</style><script>if(new URLSearchParams(location.search).has('embedded'))document.documentElement.classList.add('embedded')</script></head><body><main><div class="top"><b>妖怪絵巻</b><span>THREE STAGE SHOOTING</span></div><canvas id="view" width="960" height="600"></canvas><div class="touch"><div class="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="action"><button data-key="a">ショット</button><button data-key="b">奥義</button><button data-key="start">開始／停止</button></div></div><div class="guide">十字キー：移動　A：ショット（長押し）　B：奥義　START：開始・一時停止</div></main><script src="./yokai.js"></script></body></html>
