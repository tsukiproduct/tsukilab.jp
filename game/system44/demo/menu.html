<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:Bebas;src:url('./fonts/bebas-neue.ttf')}*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:#0e100f;color:#eae4d8;overflow:hidden}body{font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#383a32 0,#1b1d1a 42%,#111211 100%)}.outer{height:100%;max-width:1200px;margin:auto;padding:clamp(14px,3vh,26px) 4.5vw;display:flex;flex-direction:column}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c7b79b55;padding-bottom:12px;color:#cbbda5;font:700 clamp(9px,1.3vw,12px) system-ui;letter-spacing:.2em}.brand{color:#f5e8d2}.head{display:flex;justify-content:space-between;align-items:end;margin:16px 0 12px}.head h1{font:clamp(38px,6vw,62px)/.9 Bebas,Impact,sans-serif;letter-spacing:.06em;margin:0;color:#f6ead8}.head p{font-size:clamp(10px,1.4vw,14px);color:#c4b7a7;margin:0}.items{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{position:relative;overflow:hidden;min-height:0;border:1px solid #8e817088;background:#262720;text-align:left;padding:0;color:#f9f0e2;touch-action:manipulation;cursor:pointer}.item:focus-visible{outline:2px solid white;outline-offset:3px}.item.active{border:3px solid #ebcf9d;box-shadow:0 0 0 2px #e1bd7440}.art{position:absolute;inset:0;background-size:cover;background-position:center}.one .art{background-image:linear-gradient(0deg,#0c0e0eea 0%,#10100f55 48%,#0c0e0e22 100%),url('./title-art.png')}.two .art{background-image:linear-gradient(0deg,#101b1cea 0%,#14212966 55%,#111a1a22),url('./yokai-title.webp');background-position:14% center}.three .art{background-image:linear-gradient(0deg,#3a1513ed 0%,#39141255 55%,#32161222),url('./junk-title.webp');background-position:66% center}.number{position:absolute;top:11px;left:13px;color:#fff0da;font:clamp(19px,2.9vw,30px) Bebas,Impact,sans-serif;letter-spacing:.08em;text-shadow:0 2px 8px black}.flag{position:absolute;top:13px;right:12px;font:700 10px system-ui;letter-spacing:.13em;color:#e6d6bd;border:1px solid #e8d4b883;padding:4px 6px}.body{position:absolute;left:14px;right:14px;bottom:16px}.genre{font:700 clamp(8px,1.2vw,10px) system-ui;letter-spacing:.16em;color:#e8c49d;margin-bottom:8px}.body strong{display:block;font:clamp(25px,3.5vw,38px)/.95 Bebas,Impact,sans-serif;letter-spacing:.05em}.two .body strong{font:700 clamp(23px,3vw,34px)/1.1 'Hiragino Mincho ProN','Yu Mincho',serif;letter-spacing:.1em}.body small{display:block;margin-top:9px;color:#e0d4c3;font:clamp(10px,1.3vw,13px)/1.45 system-ui}.rule{width:28px;height:2px;background:#dbb87f;margin-bottom:10px}.foot{display:flex;justify-content:space-between;align-items:center;padding-top:13px;color:#b9ad9b;font:clamp(10px,1.25vw,13px) system-ui}.foot b{color:#f0dfc4}.active .flag{background:#ebcf9d;color:#2b261e}@media(max-width:500px){.outer{padding:12px}.items{gap:5px}.body{left:7px;right:7px;bottom:10px}.body small{font-size:9px}.number{left:8px;top:6px}.flag{right:5px;top:7px;font-size:8px}.head{margin:10px 0}.foot{font-size:9px}}
</style></head><body><div class="outer"><div class="bar"><span class="brand">SYSTEM 44</span><span>GAME COLLECTION　/　03 TITLES</span></div><div class="head"><h1>SELECT GAME</h1><p>遊ぶゲームを選んでください</p></div><div class="items"><button class="item one active"><span class="art"></span><span class="number">01</span><span class="flag">PLAY</span><span class="body"><span class="genre">SURVIVAL HORROR</span><span class="rule"></span><strong>REDEMPTION</strong><small>閉ざされた屋敷の真実へ。</small></span></button><button class="item two"><span class="art"></span><span class="number">02</span><span class="flag">PLAY</span><span class="body"><span class="genre">YOKAI SHOOTING</span><span class="rule"></span><strong>妖怪絵巻</strong><small>武将、百鬼に挑む。</small></span></button><button class="item three"><span class="art"></span><span class="number">03</span><span class="flag">PLAY</span><span class="body"><span class="genre">FOOD MERGE PUZZLE</span><span class="rule"></span><strong>JUNK FOOD<br>FEVER</strong><small>合体させてハイスコア！</small></span></button></div><div class="foot"><span><b>◀ ▶</b> で選択　 <b>A / START</b> で決定</span><span>VER. 0.14</span></div></div><script>let selected=0,buttons=[...document.querySelectorAll('.item')];function render(){buttons.forEach((b,i)=>b.classList.toggle('active',i===selected))}function select(i){selected=i;render();parent.postMessage({source:'handheld-menu',game:['redemption','yokai','junk'][i]},location.origin)}buttons.forEach((b,i)=>b.onclick=()=>select(i));window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.source!=='redemption-handheld'||!e.data.down)return;let c=e.data.control;if(c==='up'||c==='left')selected=(selected+2)%3;if(c==='down'||c==='right')selected=(selected+1)%3;if(c==='a'||c==='start')select(selected);render()});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowUp')selected=(selected+2)%3;if(e.key==='ArrowRight'||e.key==='ArrowDown')selected=(selected+1)%3;if(e.key==='Enter'||e.code==='Space')select(selected);render()});</script></body></html>
