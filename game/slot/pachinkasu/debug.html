<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>スロットぱちんかす — デバッグモード</title>
<link rel="stylesheet" href="src/ui/style.css">
<!-- デバッグモード専用エントリ。index.html と中身は同じで、
     main.js にデバッグ有効を伝えるフラグだけ先に立てておく。
     リダイレクトにしないのは、ハッシュだけ変えてもページが再読み込みされず
     デバッグ判定が走らないため。 -->
<script>window.__PACHINKASU_DEBUG__ = true;</script>
</head>
<body>
<div id="app">
  <div id="lcd">
    <video id="lcdloop" muted playsinline loop></video>
    <video id="lcdmovie" muted playsinline></video>
    <div class="badge" id="stateBadge">通常</div>
    <div id="atinfo">MOON TIME<br><b id="atg">0</b>G</div>
    <img id="cutin" alt="">
    <img id="announce" alt="">
    <!-- ボーナス中の累計獲得枚数。告知画面の上に大きく重ねる -->
    <div id="bonusCount"><b id="bonusNum">0</b><span>枚</span></div>
    <div id="nav"></div>
    <!-- ボーナス確定までの段階演出（カットイン→溜め→濃厚告知） -->
    <div id="reveal"><img id="revealCut" alt=""><div id="revealText"></div></div>
    <!-- 楽曲切替ボタン（BIG中・AT中のみ表示） -->
    <button id="songbtn" title="楽曲を切り替える">♪</button>
    <!-- エンペラータイム（特化ゾーン） -->
    <div id="emperor">
      <div class="empttl">EMPEROR TIME</div>
      <div class="empwin" id="empWin">BATTLE</div>
      <div class="emptotal">＋<b id="empNum">0</b>G</div>
    </div>
    <!-- AT終了3ゲーム前からのカウントダウン -->
    <div id="countdown"><b id="cdNum">3</b><span id="cdLabel">G</span></div>
    <!-- ボーナス／AT終了時のリザルト画面 -->
    <div id="result">
      <div class="rttl" id="rTtl"></div>
      <div class="rmain"><b id="rNum">0</b><span id="rUnit">枚</span></div>
      <div class="rsub" id="rSub"></div>
    </div>
    <div id="flashfx"></div>
    <!-- ビタ押しチャレンジ中の「狙え」表示。中リールを止めると消える -->
    <div id="vita">
      <div class="vitalabel">ビタ押しチャレンジ!</div>
      <div class="vitatarget">中リール <b>赤7</b> を狙え！</div>
      <div class="vitahint">±1コマまで成功</div>
    </div>
  </div>

  <div id="reelzone">
    <div class="reel" id="r0"><div class="cell"><img alt=""></div><div class="cell mid"><img alt=""></div><div class="cell"><img alt=""></div></div>
    <div class="reel" id="r1"><div class="cell"><img alt=""></div><div class="cell mid"><img alt=""></div><div class="cell"><img alt=""></div></div>
    <div class="reel" id="r2"><div class="cell"><img alt=""></div><div class="cell mid"><img alt=""></div><div class="cell"><img alt=""></div></div>
  </div>

  <!-- ラベル(CREDIT/PAYOUT/GAME)は seg_frame.jpg に焼き込み済み。数字だけを桁窓に重ねる -->
  <div id="seg">
    <span class="segnum" id="credit">1000</span>
    <span class="segnum" id="payout">0</span>
    <span class="segnum" id="game">0</span>
  </div>

  <div id="ctrl">
    <button id="bet">MAX<br>BET</button>
    <button id="lever"></button>
    <button class="stop" id="s0"></button>
    <button class="stop" id="s1"></button>
    <button class="stop" id="s2"></button>
    <button id="menu">MENU</button>
  </div>

  <!-- 下パネル全体が1つのタップ操作面（スマホで片手で打つため）。
       タップするたび MAXBET→レバー→左→中→右 と順に送られる。
       次に何が押されるかは #paneltapLabel に出る -->
  <div id="panel">
    <button id="paneltap"><span id="paneltapLabel"></span></button>
  </div>

  <div class="overlay" id="titleov">
    <img src="assets/announce/an_title.jpg" alt="スロットぱちんかす">
    <button class="gbtn" id="startbtn">遊技開始</button>
    <div class="small">A+AT機プロトタイプ ｜ 分母65536・完全確率</div>
    <a class="guidelink" href="guide/">▶ 機種スペック・解析を見る</a>
    <!-- バージョン。中身は src/ui/version.js が入れる -->
    <div class="ver" id="ver"></div>
  </div>


  <!-- 楽曲選択（ペルソナ5風: 赤×黒×白・斜め・切り抜き文字） -->
  <div class="overlay" id="songsel">
    <div class="songttl"><span>SELECT</span><b>MUSIC</b></div>
    <div class="songlist">
      <button class="songcard" data-song="song1">
        <span class="no">01</span>
        <span class="tt">回胴式の魔法</span>
        <span class="sb">KAIDOU-SHIKI NO MAHOU</span>
      </button>
      <button class="songcard" data-song="song2">
        <span class="no">02</span>
        <span class="tt">ひきよわヒーロー</span>
        <span class="sb">HIKIYOWA HERO</span>
      </button>
    </div>
    <button class="gbtn songskip" id="songskip">この曲で開始</button>
  </div>

  <div class="overlay" id="menuov">
    <div class="ttl">設定変更（変更でリセット）</div>
    <div class="setrow" id="setrow"></div>
    <div class="datap" id="dataview"></div>
    <button class="gbtn" id="closebtn">閉じる</button>
  </div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
