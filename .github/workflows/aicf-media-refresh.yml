name: AICF Refresh Video URLs
on:
  workflow_dispatch:
  push:
    paths:
      - 'aicf/tool/works.json'
      - 'aicf/tool/video_sources.json'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: aicf-media-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U yt-dlp
      - name: Refresh direct MP4 URLs
        run: |
          python - <<'PY'
          import json,subprocess,datetime,re
          from pathlib import Path
          root=Path('aicf/tool')
          sources=json.loads((root/'video_sources.json').read_text())
          old=json.loads((root/'media.json').read_text())
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          for id,url in sources.items():
              if not re.search(r'/status/\d+',url):
                  out[id]={'error':'作品投稿のURLが必要です'}
                  continue
              try:
                  p=subprocess.run(['yt-dlp','--no-playlist','--skip-download','--print','%(url)s','--extractor-args','twitter:api=syndication',url],capture_output=True,text=True,timeout=55)
                  candidates=[line.strip() for line in p.stdout.splitlines() if line.strip().startswith('https://') and ('.mp4' in line or 'video.twimg.com' in line)]
                  if p.returncode==0 and candidates:
                      out[id]={'url':candidates[0]}
                  else:
                      out[id]=old.get(id,{'error':'動画URLを取得できませんでした'})
              except Exception:
                  out[id]=old.get(id,{'error':'動画URLを取得できませんでした'})
          (root/'media.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit updated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aicf/tool/media.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(aicf): refresh video links"
            git push
          fi
