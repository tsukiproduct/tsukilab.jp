name: Halotei game QA
on:
  push:
    branches: ['codex/halotei-visual-v9']
    paths: ['game/bitosuv/**', 'game/halotei/**', '.github/workflows/halotei-qa.yml']
  pull_request:
    paths: ['game/bitosuv/**', 'game/halotei/**', '.github/workflows/halotei-qa.yml']
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test game/bitosuv/tests/*.test.mjs
      - name: Install isolated browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/halotei-qa" --no-save playwright@1.58.2
      - name: Install test browsers
        run: '"$RUNNER_TEMP/halotei-qa/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Browser smoke tests and screenshots
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/halotei-qa/node_modules/playwright/index.mjs
        run: node game/bitosuv/tools/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halotei-browser-qa
          path: browser-qa/
          retention-days: 7
