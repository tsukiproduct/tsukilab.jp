<style>
:root{
  color-scheme: dark;
  --ink:#f3ecf6;
  --ink-dim:#b7aec2;
  --glass:rgba(16,13,24,.62);
  --line:rgba(255,255,255,.14);
  --mau:#ff8fc8;
  --nyau:#8fc6ff;
  --ground:#07060b;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --dot:"DotGothic16","Zen Maru Gothic",ui-monospace,monospace;
}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);overflow:hidden;font-family:var(--ui);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#c:active{cursor:grabbing}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--nyau);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.where{display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.where .ja{font-family:var(--dot);font-size:clamp(22px,4.2vw,32px);letter-spacing:.06em;line-height:1.1}
.where .en{font-family:var(--dot);font-size:11px;letter-spacing:.28em;color:var(--ink-dim)}
.where .meter{font-family:var(--dot);font-size:12px;color:var(--ink-dim);display:flex;gap:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.where .meter b{color:var(--ink);font-weight:400}
.tools{display:flex;gap:8px;pointer-events:auto}
.tools button{background:var(--glass);border:1px solid var(--line);border-radius:999px;height:34px;min-width:34px;padding:0 12px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tools button[aria-pressed="true"]{border-color:var(--nyau);color:var(--nyau)}

.help{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);max-width:min(300px,calc(100vw - 32px));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.75;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
.help h2{margin:0 0 6px;font-size:13px;letter-spacing:.12em;color:var(--ink-dim);font-weight:700}
.help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.help dt{font-family:var(--dot);color:var(--mau);white-space:nowrap}
.help dd{margin:0}
.help .touch{display:none}
@media (pointer:coarse){.help .desk{display:none}.help .touch{display:grid}}

.rooms{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:0 0 auto;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rooms button:hover{border-color:rgba(255,255,255,.35)}
.rooms button.on{background:rgba(255,143,200,.2);border-color:var(--mau)}
.rooms button[data-id="nyau"].on{background:rgba(143,198,255,.2);border-color:var(--nyau)}
.rooms button[data-id="plan"]{font-family:var(--dot);font-weight:400}
@media (min-width:900px){.rooms{justify-content:center}}

.touchui{display:none}
@media (pointer:coarse){
  .touchui{display:block}
  .rooms{bottom:0}
}
.joy{position:fixed;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:112px;height:112px;border-radius:50%;border:1px solid var(--line);background:rgba(16,13,24,.35);pointer-events:none;opacity:.8}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,143,200,.35);border:1px solid var(--mau)}
.updown{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:flex;flex-direction:column;gap:10px}
.updown button{width:52px;height:52px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:18px;touch-action:none}

.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--dot);letter-spacing:.2em;color:var(--ink-dim);background:var(--ground);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fade,.help,.toast,.loading{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="部屋の中を虫の目線で飛ぶ3Dビュー"></canvas>

  </div>
  <div class="tools">
    <button id="liteBtn" aria-pressed="false" title="ボケと光のにじみを切って軽くします">軽量</button>

</div>

<div class="help" id="help">
  <h2>虫になって飛ぶ</h2>
  <dl class="desk">
    <dt>W A S D</dt><dd>前後左右に飛ぶ（矢印キーも可）</dd>
    <dt>Space / E</dt><dd>上昇</dd>
    <dt>Shift / Q</dt><dd>下降</dd>
    <dt>ドラッグ</dt><dd>見回す</dd>

  <dl class="touch">
    <dt>左側</dt><dd>なぞって飛ぶ</dd>

    <dt>▲ ▼</dt><dd>上昇・下降</dd>
    <dt>下のボタン</dt><dd>部屋へワープ</dd>

</div>

<nav class="rooms" id="rooms" aria-label="部屋を選ぶ"></nav>

<div class="touchui">
  <div class="joy" id="joy"><i id="joyKnob"></i></div>
  <div class="updown">
    <button id="upBtn" aria-label="上昇">▲</button>

  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const coarse = matchMedia('(pointer:coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lite = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060b);
scene.fog = new THREE.FogExp2(0x100c18, 0.018);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.01, 400);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0x8a90c8, 0x3a2830, 0.75));
scene.add(new THREE.AmbientLight(0x2a2438, 0.6));

/* ---------------- constants ---------------- */
const F = 0.12;   // raised floor height
const H = 2.5;    // ceiling
const T = 0.1;    // wall thickness
const PI = Math.PI;

/* ---------------- materials & helpers ---------------- */
const matCache = new Map();
function M(color, o = {}) {
  const key = color + '|' + (o.glow||'') + '|' + (o.metal??'') + '|' + (o.rough??'') + '|' + (o.glass?o.op??.2:'') + '|' + (o.side||'');
  if (matCache.has(key)) return matCache.get(key);
  let m;
  if (o.glow) m = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(o.glow) });
  else if (o.glass) m = new THREE.MeshStandardMaterial({ color, transparent:true, opacity:o.op??.2, roughness:o.rough??.05, metalness:.1, depthWrite:false, envMap:envTex, envMapIntensity:.5 });
  else if (o.metal !== undefined || o.rough !== undefined) m = new THREE.MeshStandardMaterial({ color, metalness:o.metal??0, roughness:o.rough??.5, envMap:envTex, envMapIntensity:.35 });
  else m = new THREE.MeshLambertMaterial({ color });
  if (o.side) m.side = THREE.DoubleSide;
  matCache.set(key, m);
  return m;
}
const boxG = new THREE.BoxGeometry(1,1,1);
const statics = [];
const colliders = [];
const ceilingGroup = new THREE.Group(); scene.add(ceilingGroup);

function add(mesh, o) {
  (o.parent || scene).add(mesh);
  mesh.updateMatrixWorld(true);
  if (o.col !== false) colliders.push(new THREE.Box3().setFromObject(mesh));
  if (!o.dyn && !o.parent) statics.push(mesh);
  return mesh;
}
// box with bottom at y
function B(w,h,d,color,x,y,z,o={}) {
  const m = new THREE.Mesh(boxG, o.mat || M(color,o));
  m.scale.set(w,h,d);
  m.position.set(x, o.c ? y : y+h/2, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  return add(m,o);
}
function BX(x0,x1,y0,y1,z0,z1,color,o={}) { return B(x1-x0,y1-y0,z1-z0,color,(x0+x1)/2,y0,(z0+z1)/2,o); }
function C(rt,rb,h,color,x,y,z,o={}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||16), o.mat || M(color,o));
  m.position.set(x, o.c ? y : y+h/2, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  return add(m,o);
}
function S(r,color,x,y,z,o={}) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, o.seg||16, Math.max(8,(o.seg||16)*.6|0)), o.mat || M(color,o));
  m.position.set(x,y,z);
  m.scale.set(o.sx||1,o.sy||1,o.sz||1);
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.rx) m.rotation.x = o.rx;
  return add(m,o);
}
function TOR(r,tube,color,x,y,z,o={}) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,24,o.arc||PI*2), o.mat||M(color,o));
  m.position.set(x,y,z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  return add(m,o);
}
// plane with UVs tiled in metres
function plane(w,h,mat,x,y,z,rx,ry,tile=0,o={}) {
  const g = new THREE.PlaneGeometry(w,h);
  if (tile) { const uv=g.attributes.uv; for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*w/tile, uv.getY(i)*h/tile); }
  const m = new THREE.Mesh(g, mat);
  m.position.set(x,y,z); m.rotation.set(rx||0, ry||0, 0, 'YXZ');
  return add(m, {col:false, ...o});
}
function floorPlane(x0,x1,z0,z1,y,mat,tile) { return plane(x1-x0, z1-z0, mat, (x0+x1)/2, y, (z0+z1)/2, -PI/2, 0, tile); }
function PL(color,intensity,dist,x,y,z){ const l=new THREE.PointLight(color,intensity,dist,1.6); l.position.set(x,y,z); scene.add(l); return l; }

function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  if (repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  t.userData.canvas=c; t.userData.ctx=g;
  return t;
}
const rnd = (a,b)=>a+Math.random()*(b-a);
let seed = 7; const srnd = (a=0,b=1)=>{ seed=(seed*16807)%2147483647; return a+(seed/2147483647)*(b-a); };

/* ---------------- textures ---------------- */
const woodTex = canvasTex(512,512,(g,w,h)=>{
  const plank=64;
  for(let x=0;x<w;x+=plank){
    let y=-srnd(0,300);
    while(y<h){
      const L=srnd(220,420);
      const l=srnd(26,40);
      g.fillStyle=`hsl(${srnd(22,30)},${srnd(32,44)}%,${l}%)`;
      g.fillRect(x,y,plank,L);
      for(let k=0;k<14;k++){ g.strokeStyle=`rgba(40,22,10,${srnd(.04,.12)})`; g.beginPath(); const gx=x+srnd(4,plank-4); g.moveTo(gx,y); g.bezierCurveTo(gx+srnd(-6,6),y+L*.3,gx+srnd(-6,6),y+L*.7,gx+srnd(-3,3),y+L); g.stroke(); }
      g.fillStyle='rgba(20,10,4,.55)'; g.fillRect(x,y,plank,2);
      y+=L;
    }
    g.fillStyle='rgba(20,10,4,.6)'; g.fillRect(x,0,2,h);
  }
},true);
const woodMat = new THREE.MeshStandardMaterial({ map:woodTex, roughness:.55, metalness:0, envMap:envTex, envMapIntensity:.25 });
const tileTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#c9d3d8'; g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){ g.fillStyle=`hsl(200,12%,${srnd(76,84)}%)`; g.fillRect(i*64+2,j*64+2,60,60); }
  g.fillStyle='#8e9aa1'; for(let i=0;i<=4;i++){ g.fillRect(i*64-1,0,2,h); g.fillRect(0,i*64-1,w,2); }
},true);
const tileMat = new THREE.MeshStandardMaterial({ map:tileTex, roughness:.25, envMap:envTex, envMapIntensity:.35 });
const stoneTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#34343a'; g.fillRect(0,0,w,h);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){ g.fillStyle=`hsl(240,4%,${srnd(20,27)}%)`; g.fillRect(i*128+3,j*128+3,122,122);
    for(let k=0;k<160;k++){ g.fillStyle=`rgba(255,255,255,${srnd(0,.08)})`; g.fillRect(i*128+srnd(3,125),j*128+srnd(3,125),2,2);} }
},true);
const stoneMat = new THREE.MeshLambertMaterial({ map:stoneTex });
const cushionTex = canvasTex(128,128,(g,w,h)=>{
  g.fillStyle='#d9d5cf'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(120,110,100,.25)'; g.lineWidth=2;
  for(let i=0;i<8;i++){ g.beginPath(); g.moveTo(i*16,0); g.lineTo(i*16+64,h); g.stroke(); }
},true);
const cushionMat = new THREE.MeshLambertMaterial({ map:cushionTex });
const concreteTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#5b5c62'; g.fillRect(0,0,w,h);
  for(let k=0;k<2500;k++){ g.fillStyle=`rgba(${srnd()<.5?0:255},${srnd()<.5?0:255},255,${srnd(0,.05)})`; g.fillRect(srnd(0,w),srnd(0,h),2,2); }
},true);
const concreteMat = new THREE.MeshLambertMaterial({ map:concreteTex });
const wallMat = M('#d7d0c6');
const wallMatNyau = M('#c6cfdc');
const wallMatMau = M('#e0cad3');

function posterTex(kind){
  return canvasTex(256,360,(g,w,h)=>{
    if(kind==='moon'){
      const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#1b0f2b'); gr.addColorStop(1,'#5b1d4a'); g.fillStyle=gr; g.fillRect(0,0,w,h);
      g.fillStyle='#ffe9f4'; g.beginPath(); g.arc(128,130,70,0,PI*2); g.fill();
      g.fillStyle='#1b0f2b'; g.beginPath(); g.arc(160,112,62,0,PI*2); g.fill();
      for(let i=0;i<40;i++){ g.fillStyle='rgba(255,220,240,.7)'; g.fillRect(srnd(0,w),srnd(0,230),2,2); }
      g.fillStyle='#ff8fc8'; g.font='bold 34px sans-serif'; g.textAlign='center'; g.fillText('MIDNIGHT',128,280);
      g.font='16px sans-serif'; g.fillStyle='#f3d6e6'; g.fillText('まよなかは まだ おわらない',128,312);
    } else if(kind==='pink'){
      g.fillStyle='#f6d3e2'; g.fillRect(0,0,w,h);
      for(let i=0;i<9;i++){ g.fillStyle=`hsla(${srnd(310,350)},80%,${srnd(55,75)}%,.85)`; g.beginPath(); g.arc(srnd(0,w),srnd(0,h),srnd(20,80),0,PI*2); g.fill(); }
      g.fillStyle='#1a1020'; g.font='bold 42px sans-serif'; g.fillText('だう', 20, 330);
    } else {
      g.fillStyle='#0e1a33'; g.fillRect(0,0,w,h);
      for(let i=0;i<14;i++){ g.strokeStyle=`hsla(${205+i*3},80%,${50+i*2}%,.8)`; g.lineWidth=3; g.beginPath();
        for(let x=0;x<=w;x+=8){ const y=60+i*20+Math.sin(x*.04+i*.6)*14; x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke(); }
      g.fillStyle='#cfe6ff'; g.font='bold 26px sans-serif'; g.fillText('BLUE HOUR', 24, 340);
    }
  });
}

/* ---------------- walls ---------------- */
const glassMat = M('#9ec0da',{glass:true, op:.14});
const frostMat = new THREE.MeshStandardMaterial({ color:0x6d7fa8, emissive:0x1a2240, transparent:true, opacity:.75, roughness:.9 });
function wallX(z,x0,x1,ops=[],mat=wallMat){
  ops.sort((a,b)=>a.a-b.a); let cur=x0;
  for(const op of ops){
    if(op.a>cur) BX(cur,op.a,0,H,z-T/2,z+T/2,null,{mat});
    if(op.y0>0) BX(op.a,op.b,0,op.y0,z-T/2,z+T/2,null,{mat});
    if(op.y1<H) BX(op.a,op.b,op.y1,H,z-T/2,z+T/2,null,{mat});
    if(op.glass) BX(op.a,op.b,op.y0,op.y1,z-.01,z+.01,null,{mat: op.glass==='frost'?frostMat:glassMat});
    if(op.glass){ // aluminium frame
      BX(op.a,op.b,op.y0-.03,op.y0,z-.06,z+.06,'#8d9097',{metal:.6,rough:.4});
      BX(op.a,op.b,op.y1,op.y1+.03,z-.06,z+.06,'#8d9097',{metal:.6,rough:.4});
      BX(op.a-.03,op.a,op.y0,op.y1,z-.06,z+.06,'#8d9097',{metal:.6,rough:.4});
      BX(op.b,op.b+.03,op.y0,op.y1,z-.06,z+.06,'#8d9097',{metal:.6,rough:.4});
    }
    cur=op.b;
  }
  if(cur<x1) BX(cur,x1,0,H,z-T/2,z+T/2,null,{mat});
}
function wallZ(x,z0,z1,ops=[],mat=wallMat){
  ops.sort((a,b)=>a.a-b.a); let cur=z0;
  for(const op of ops){
    if(op.a>cur) BX(x-T/2,x+T/2,0,H,cur,op.a,null,{mat});
    if(op.y0>0) BX(x-T/2,x+T/2,0,op.y0,op.a,op.b,null,{mat});
    if(op.y1<H) BX(x-T/2,x+T/2,op.y1,H,op.a,op.b,null,{mat});
    cur=op.b;
  }
  if(cur<z1) BX(x-T/2,x+T/2,0,H,cur,z1,null,{mat});

function particleMat(color, additive){
  return new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending: additive?THREE.AdditiveBlending:THREE.NormalBlending,
    uniforms:{uColor:{value:new THREE.Color(color)}, uScale:{value:600}},
    vertexShader:`attribute float aSize; attribute float aAlpha; varying float vA; uniform float uScale;
      void main(){ vec4 mv=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mv; gl_PointSize=min(aSize*uScale/max(-mv.z,.001),380.); vA=aAlpha; }`,
    fragmentShader:`uniform vec3 uColor; varying float vA; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.0,d); gl_FragColor=vec4(uColor, a*a*vA); }`
  });
}
const pMats=[];
class Emitter{
  constructor(n,color,spawn,o){ this.n=n; this.spawn=spawn; this.o=o;
    this.pos=new Float32Array(n*3); this.size=new Float32Array(n); this.alpha=new Float32Array(n);
    this.vel=new Float32Array(n*3); this.life=new Float32Array(n); this.max=new Float32Array(n);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(this.pos,3)); g.setAttribute('aSize',new THREE.BufferAttribute(this.size,1)); g.setAttribute('aAlpha',new THREE.BufferAttribute(this.alpha,1));
    this.mat=particleMat(color,o.additive); pMats.push(this.mat);
    this.pts=new THREE.Points(g,this.mat); this.pts.frustumCulled=false; scene.add(this.pts); this.g=g;
    for(let i=0;i<n;i++){ this.reset(i); this.life[i]=Math.random()*this.max[i]; }
  }
  reset(i){ const p=this.spawn(); this.pos.set(p,i*3); const v=this.o.vel(); this.vel.set(v,i*3); this.life[i]=0; this.max[i]=rnd(this.o.life[0],this.o.life[1]); }
  update(dt,t){ for(let i=0;i<this.n;i++){ this.life[i]+=dt; if(this.life[i]>this.max[i]) this.reset(i);
      const k=this.life[i]/this.max[i];
      this.pos[i*3]+=(this.vel[i*3]+Math.sin(t*.7+i)*this.o.wob)*dt; this.pos[i*3+1]+=this.vel[i*3+1]*dt; this.pos[i*3+2]+=(this.vel[i*3+2]+Math.cos(t*.6+i*1.3)*this.o.wob)*dt;
      this.size[i]=this.o.size[0]+(this.o.size[1]-this.o.size[0])*k;
      this.alpha[i]=this.o.alpha*Math.sin(k*PI)*(this.o.twinkle?(.6+.4*Math.sin(t*3+i*7)):1); }
    this.g.attributes.position.needsUpdate=true; this.g.attributes.aSize.needsUpdate=true; this.g.attributes.aAlpha.needsUpdate=true; }
}

{

function applyWarp(id){
  if(id==='plan'){ mode='plan'; ceilingGroup.visible=false; planAng=-.6; vel.set(0,0,0); return; }
  const r=ROOMS.find(r=>r.id===id); mode='fly'; ceilingGroup.visible=true;

}
function warp(id, instant){
  if(instant||reduceMotion){ applyWarp(id); return; }
  if(warping) return; warping=true; fade.classList.add('on');
  setTimeout(()=>{ applyWarp(id); fade.classList.remove('on'); warping=false; },230);
}

  if(e.pointerType==='touch' && e.clientX<innerWidth*.45 && joy.id===null && mode==='fly'){ joy.id=e.pointerId; joy.x0=e.clientX; joy.y0=e.clientY; joy.dx=joy.dy=0; joyEl.style.left=(e.clientX-56)+'px'; joyEl.style.top=(e.clientY-56)+'px'; joyEl.style.bottom='auto'; }
  else if(look.id===null){ look.id=e.pointerId; look.x=e.clientX; look.y=e.clientY; }
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){ let dx=e.clientX-joy.x0, dy=e.clientY-joy.y0; const L=Math.hypot(dx,dy), m=48; if(L>m){dx*=m/L;dy*=m/L;} joy.dx=dx/m; joy.dy=dy/m; knob.style.transform=`translate(${dx}px,${dy}px)`; lastInput=performance.now(); }
  else if(e.pointerId===look.id){ const dx=e.clientX-look.x, dy=e.clientY-look.y; look.x=e.clientX; look.y=e.clientY; const s=e.pointerType==='touch'?.006:.004;
    if(mode==='plan'){ planAng-=dx*.006; } else { yaw-=dx*s; pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*s)); } lastInput=performance.now(); }
});
function endPtr(e){ if(e.pointerId===joy.id){ joy.id=null; joy.dx=joy.dy=0; knob.style.transform=''; joyEl.style.left=''; joyEl.style.top=''; joyEl.style.bottom=''; } if(e.pointerId===look.id) look.id=null; }
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
let upHeld=0, downHeld=0;
for(const [id,set] of [['upBtn',v=>upHeld=v],['downBtn',v=>downHeld=v]]){ const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();set(1);lastInput=performance.now();}); for(const ev of ['pointerup','pointerleave','pointercancel']) b.addEventListener(ev,()=>set(0)); }

/* ---------------- UI buttons ---------------- */
const help=document.getElementById('help'), helpBtn=document.getElementById('helpBtn');
function setHelp(v){ help.hidden=!v; helpBtn.setAttribute('aria-expanded',String(v)); }
helpBtn.onclick=()=>setHelp(help.hidden);
setTimeout(()=>{ if(!help.hidden) setHelp(false); }, 9000);
const liteBtn=document.getElementById('liteBtn');
function setLite(v){ lite=v; bloom.enabled=!v; bokeh.enabled=!v; liteBtn.setAttribute('aria-pressed',String(v)); resize(); }
liteBtn.onclick=()=>setLite(!lite);
document.getElementById('fsBtn').onclick=()=>{ const d=document; if(d.fullscreenElement) d.exitFullscreen?.().catch(()=>{}); else d.documentElement.requestFullscreen?.().catch(()=>toast('この画面では全画面にできません')); };
const toastEl=document.getElementById('toast'); let toastT;
function toast(s){ toastEl.textContent=s; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2600); }

/* ---------------- collision ---------------- */
const R=.03;
const tmpV=new THREE.Vector3();
function collide(p){
  for(const b of colliders){
    if(p.x<b.min.x-R||p.x>b.max.x+R||p.y<b.min.y-R||p.y>b.max.y+R||p.z<b.min.z-R||p.z>b.max.z+R) continue;
    tmpV.copy(p).clamp(b.min,b.max);
    const dx=p.x-tmpV.x, dy=p.y-tmpV.y, dz=p.z-tmpV.z; const d=Math.hypot(dx,dy,dz);
    if(d>1e-6){ if(d<R){ const k=(R-d)/d; p.x+=dx*k; p.y+=dy*k; p.z+=dz*k; const n=new THREE.Vector3(dx,dy,dz).normalize(); const vn=vel.dot(n); if(vn<0) vel.addScaledVector(n,-vn); } }
    else { // inside: push out along smallest penetration
      const o=[p.x-b.min.x+R, b.max.x-p.x+R, p.y-b.min.y+R, b.max.y-p.y+R, p.z-b.min.z+R, b.max.z-p.z+R]; let i=0; for(let k=1;k<6;k++) if(o[k]<o[i]) i=k;
      if(i===0){p.x=b.min.x-R;vel.x=Math.min(vel.x,0);} else if(i===1){p.x=b.max.x+R;vel.x=Math.max(vel.x,0);} else if(i===2){p.y=b.min.y-R;vel.y=Math.min(vel.y,0);} else if(i===3){p.y=b.max.y+R;vel.y=Math.max(vel.y,0);} else if(i===4){p.z=b.min.z-R;vel.z=Math.min(vel.z,0);} else {p.z=b.max.z+R;vel.z=Math.max(vel.z,0);} }
  }
  p.x=Math.max(.06,Math.min(9.94,p.x)); p.z=Math.max(.06,Math.min(9.85,p.z));
  const fy=floorAt(p.x,p.z)+R; if(p.y<fy){ p.y=fy; vel.y=Math.max(0,vel.y); }
  const cy=(p.z>8?2.5:H-.04); if(p.y>cy){ p.y=cy; vel.y=Math.min(0,vel.y); }
}
function rayDist(o,d){
  let best=8;
  for(const b of colliders){
    let t0=0,t1=best;
    for(const a of ['x','y','z']){ const inv=1/(d[a]||1e-9); let ta=(b.min[a]-o[a])*inv, tb=(b.max[a]-o[a])*inv; if(ta>tb){const s=ta;ta=tb;tb=s;} t0=Math.max(t0,ta); t1=Math.min(t1,tb); if(t0>t1) break; }
    if(t0<=t1 && t0>0.001) best=t0;
  }
  const fy=floorAt(o.x,o.z); if(d.y<0){ const t=(fy-o.y)/d.y; if(t>0&&t<best) best=t; } if(d.y>0 && o.z<8){ const t=(H-o.y)/d.y; if(t>0&&t<best) best=t; }
  return best;
}

/* ---------------- HUD ---------------- */
const roomJa=document.getElementById('roomJa'), roomEn=document.getElementById('roomEn'), altEl=document.getElementById('alt'), fpsEl=document.getElementById('fps');
let curRoom='';
function setRoom(r){ const id=r?r.id:'out'; if(id===curRoom) return; curRoom=id; roomJa.textContent=r?r.ja:'そと'; roomEn.textContent=r?r.en:'OUTSIDE';
  for(const b of nav.children) b.classList.toggle('on', b.dataset.id===id); }

/* ---------------- TV animation ---------------- */
const tvCtx = tvTex.userData.ctx;
function drawTV(t){
  const g=tvCtx, w=320, h=180;
  const hue=(t*12)%360;
  const gr=g.createLinearGradient(0,0,w,h); gr.addColorStop(0,`hsl(${hue},55%,22%)`); gr.addColorStop(1,`hsl(${(hue+60)%360},60%,12%)`); g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){ const x=(i*57+t*30*(i%2?1:-1))%(w+80)-40; const y=90+Math.sin(t*1.3+i)*50; g.fillStyle=`hsla(${(hue+i*40)%360},80%,70%,.45)`; g.beginPath(); g.arc((x+w+80)%(w+80)-40,y,14+i*4,0,PI*2); g.fill(); }
  g.fillStyle='rgba(255,255,255,.85)'; for(let x=0;x<w;x+=8){ const a=Math.abs(Math.sin(x*.05+t*4)*Math.cos(x*.017-t))*40; g.fillRect(x,h-18-a,5,a); }
  g.fillStyle='#fff'; g.font='bold 13px sans-serif'; g.fillText('LIVE  深夜2時の音楽番組',10,20);
  g.fillStyle='rgba(0,0,0,.25)'; for(let y=0;y<h;y+=3) g.fillRect(0,y,w,1);
  tvTex.needsUpdate=true;
}

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
let focusDist=1, fpsAcc=0, fpsN=0, fpsShown=0, frame=0, autoChecked=false, startT=performance.now();
const fwd=new THREE.Vector3(), right=new THREE.Vector3(), up=new THREE.Vector3(0,1,0);
function step(){
  const dt=Math.min(clock.getDelta(),.05); const t=clock.elapsedTime; frame++;
  // --- flight
  if(mode==='fly'){
    let f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-joy.dy;
    let s=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+joy.dx;
    let u=(keys.has('Space')||keys.has('KeyE')||upHeld?1:0)-(keys.has('ShiftLeft')||keys.has('ShiftRight')||keys.has('KeyQ')||downHeld?1:0);
    fwd.set(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
    right.set(Math.cos(yaw),0,-Math.sin(yaw));
    const acc=3.2;
    vel.addScaledVector(fwd,f*acc*dt).addScaledVector(right,s*acc*dt).addScaledVector(up,u*acc*dt);
    vel.multiplyScalar(Math.exp(-2.6*dt));
    const sp=vel.length(), vmax=1.1; if(sp>vmax) vel.multiplyScalar(vmax/sp);
    pos.addScaledVector(vel,dt); collide(pos);
    const bob=reduceMotion?0:1;
    const targetRoll = -s*.12 + Math.sin(t*2.7)*.02*bob;
    roll += (targetRoll-roll)*Math.min(1,dt*4);
    camera.position.set(pos.x+Math.sin(t*11)*.0015*bob, pos.y+Math.sin(t*7.3)*.004*bob+Math.sin(t*23)*.0008*bob, pos.z+Math.cos(t*9)*.0015*bob);
    camera.rotation.set(pitch+Math.sin(t*5.1)*.006*bob, yaw+Math.sin(t*3.7)*.008*bob, roll);
    // autofocus
    if(frame%4===0){ const d=rayDist(camera.position,fwd); focusDist+= (d-focusDist)*.35; }
    bokeh.uniforms.focus.value=Math.max(.05,focusDist);
    bokeh.uniforms.aperture.value=.0035;
    bokeh.uniforms.maxblur.value=.009;
    setRoom(roomAt(pos.x,pos.z));
    altEl.textContent=(pos.y-floorAt(pos.x,pos.z)).toFixed(2);
  } else {
    if(performance.now()-lastInput>2500 && !reduceMotion) planAng+=dt*.08;
    const cx=5, cz=4.6, r=7.5;
    camera.position.set(cx+Math.sin(planAng)*r, 10.5, cz+Math.cos(planAng)*r);
    camera.lookAt(cx,0,cz); camera.rotation.z+=0;
    bokeh.uniforms.focus.value=camera.position.distanceTo(new THREE.Vector3(cx,1,cz));
    bokeh.uniforms.aperture.value=.0006; bokeh.uniforms.maxblur.value=.004;
    setRoom({id:'plan',ja:'間取り',en:'FLOOR PLAN'});
    altEl.textContent='10.50';
  }
  // --- world animation
  const at = reduceMotion? t*.3 : t;
  for(const s of spinners) s.obj.rotation[s.axis]=at*s.speed;
  fanHead.rotation.y=Math.sin(at*.4)*.9;
  for(const c of curtains){ const a=c.g.attributes.position.array, b=c.base; const breeze=.6+.4*Math.sin(at*.3+c.phase);
    for(let i=0;i<a.length;i+=3){ const x=b[i], y=b[i+1]; const k=(c.h/2-y)/c.h; a[i+2]=Math.sin(x*28)*.03+Math.sin(at*1.4+c.phase+x*4)*c.amp*k*k*breeze; }
    c.g.attributes.position.needsUpdate=true; if(frame%6===0) c.g.computeVertexNormals(); }
  { const a=waterGeo.attributes.position.array; for(let i=0;i<a.length;i+=3){ const x=waterBase[i], y=waterBase[i+1]; a[i+2]=Math.sin(x*14+at*1.8)*.004+Math.sin(y*11-at*1.3)*.004; } waterGeo.attributes.position.needsUpdate=true; if(frame%4===0) waterGeo.computeVertexNormals(); }
  duck.position.set(6.6+Math.sin(at*.2)*.25, F+.5+Math.sin(at*1.8)*.006, .8+Math.sin(at*.13)*.35); duck.rotation.y=Math.sin(at*.17)*1.5; duck.rotation.z=Math.sin(at*1.8)*.05;
  laundry.forEach(l=>{ l.g.rotation.x=Math.sin(at*1.1+l.phase)*.14+Math.sin(at*2.3+l.phase)*.04; l.g.rotation.z=Math.sin(at*.7+l.phase)*.04; });
  moths.forEach(m=>{ const a=at*m.s+m.p; m.m.position.set(6.8+Math.cos(a)*m.r, 2.22+m.h+Math.sin(a*1.7)*.04, 8.24+Math.sin(a)*m.r*.7); m.m.rotation.y=-a; m.m.scale.x=.02*(.4+.6*Math.abs(Math.sin(at*40+m.p))); });
  wmLed.visible=Math.sin(t*4)>0;
  consoleLed.material.color.setRGB(.5+Math.sin(t*2)*.3,2+Math.sin(t*2)*1.5,4);
  fairyMats.forEach((m,i)=>{ const k=.5+.5*Math.sin(at*(1.1+i*.37)+i*2); m.color.set(['#ffd6a0','#ffb0d8','#fff0c8'][i]).multiplyScalar(1+k*4); });
  beacons.forEach((b,i)=>b.visible=Math.sin(t*2+i)>.3);
  if(frame%3===0) drawTV(at);
  tvLight.intensity=1.4+Math.sin(at*7)*.3+Math.sin(at*13.7)*.25;
  { const now=new Date(); const s=now.getSeconds()+now.getMilliseconds()/1000, m=now.getMinutes()+s/60, h=(now.getHours()%12)+m/60;
    clockS.rotation.x=-s/60*PI*2; clockM.rotation.x=-m/60*PI*2; clockH.rotation.x=-h/12*PI*2; }
  { const a=at*.35; robot.position.set(6.6+Math.cos(a)*1.25, F, 6.8+Math.sin(a)*.62); robot.rotation.y=-a-PI; }
  { const d=new THREE.Object3D(); cars.forEach((c,i)=>{ const dir=c.lane%2?1:-1; c.x+=c.v*dt*dir; if(c.x>160)c.x=-160; if(c.x<-160)c.x=160; const z=[25.5,28.5,43.5,46.5][c.lane];
      d.position.set(c.x,-15.6,z); d.scale.set(.5,.15,1.4); d.rotation.set(0,0,0); d.updateMatrix(); carHead.setMatrixAt(i,d.matrix);
      d.position.set(c.x-dir*4,-15.6,z); d.updateMatrix(); carTail.setMatrixAt(i,d.matrix); });
    carHead.instanceMatrix.needsUpdate=true; carTail.instanceMatrix.needsUpdate=true; }
  for(const e of emitters) e.update(reduceMotion?dt*.3:dt, t);

  if(lite) renderer.render(scene,camera); else composer.render();

  // fps
  fpsAcc+=dt; fpsN++; if(fpsAcc>.5){ fpsShown=Math.round(fpsN/fpsAcc); fpsEl.textContent=fpsShown+' fps'; fpsAcc=0; fpsN=0;
    if(!autoChecked && performance.now()-startT>5000 && !window.__noAutoLite){ autoChecked=true; if(fpsShown<28 && !lite){ setLite(true); toast('重かったので軽量モードにしました'); } } }
}
renderer.setAnimationLoop(step);

warp('living',true);
document.getElementById('loading').classList.add('done');
window.__app={warp:(id)=>warp(id,true), setLite, get pos(){return pos;}, setView(p,l){ mode='fly'; ceilingGroup.visible=true; pos.set(...p); vel.set(0,0,0); lookFrom(p,l); }};
</script>
