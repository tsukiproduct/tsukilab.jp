<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="声つくる">
<title>声つくる</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb}
main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:12px 0 4px}.sub{color:#aeb5c2;margin:0 0 22px}
.card{background:#151922;border:1px solid #272d3a;border-radius:20px;padding:16px;margin:12px 0}
label{display:block;font-weight:700;margin-bottom:8px}
textarea,select,input{width:100%;font:inherit;color:#fff;background:#0e1118;border:1px solid #343b4a;border-radius:14px;padding:13px}
textarea{min-height:220px;resize:vertical;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a.btn{width:100%;display:block;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;text-align:center;text-decoration:none}
.primary{background:#fff;color:#0b0d12}.secondary{background:#242a36;color:#fff;margin-top:10px}
button:disabled{opacity:.45}.status{font-size:14px;line-height:1.55;color:#c4cad4}
progress{width:100%;height:10px}.small{font-size:12px;color:#929aa8;line-height:1.55}
audio{width:100%;margin-top:12px}.hidden{display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>声つくる</h1>
<p class="sub">ブラウザ内で日本語音声を生成</p>
<div class="card">
<label for="text">読み上げる文章</label>
<textarea id="text" placeholder="ここに文章を貼り付けてください。">こんにちは。これは、iPhoneのブラウザ内で生成した音声です。</textarea>
</div>
<div class="card"><div class="grid">
<div><label for="voice">声</label><select id="voice"><option value="jf_alpha">日本語・女性</option><option value="jm_kumo">日本語・男性</option></select></div>
<div><label for="speed">速度 <span id="speedLabel">1.00</span></label><input id="speed" type="range" min="0.7" max="1.3" step="0.05" value="1"></div>
</div></div>
<div class="card">
<button id="generate" class="primary">▶ 音声を生成</button>
<div id="status" class="status" style="margin-top:12px">初回生成時はモデルと日本語辞書をダウンロードするため時間がかかります。</div>
<progress id="progress" class="hidden"></progress>
<audio id="player" controls class="hidden"></audio>
<a id="save" class="btn secondary hidden" download="koetsukuru.wav">WAVを保存</a>
</div>
<p class="small">音声合成は端末内で実行します。初回のみモデル・辞書などの取得に通信を使用します。iPhoneで長文生成が失敗する場合は、文章を短く分割してください。</p>
<script type="module">
import { KokoroJP } from "https://cdn.jsdelivr.net/npm/kokoro-js-jp@0.2.0/dist/kokoro-jp.web.js";
const $=id=>document.getElementById(id);let tts=null,currentUrl=null;
$("speed").addEventListener("input",()=>$("speedLabel").textContent=Number($("speed").value).toFixed(2));
async function loadTTS(){if(tts)return tts;$("status").textContent="音声モデルを読み込んでいます。初回はしばらくお待ちください…";$("progress").classList.remove("hidden");tts=await KokoroJP.load({dtype:"q8"});$("progress").classList.add("hidden");return tts}
$("generate").addEventListener("click",async()=>{const text=$("text").value.trim();if(!text){$("status").textContent="文章を入力してください。";return}$("generate").disabled=true;$("player").classList.add("hidden");$("save").classList.add("hidden");try{const engine=await loadTTS();$("status").textContent="音声を生成しています…";$("progress").classList.remove("hidden");const chunks=splitText(text,120);const wavs=[];for(let i=0;i<chunks.length;i++){$("status").textContent=`音声を生成しています… ${i+1}/${chunks.length}`;await new Promise(r=>setTimeout(r,0));const audio=await engine.speak(chunks[i],$("voice").value,Number($("speed").value));wavs.push(await audio.toBlob().arrayBuffer())}const blob=mergeWavs(wavs);wavs.length=0;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(blob);$("player").src=currentUrl;$("save").href=currentUrl;$("player").classList.remove("hidden");$("save").classList.remove("hidden");$("status").textContent=`生成完了（${chunks.length}分割）。再生またはWAV保存できます。`}catch(e){console.error(e);$("status").textContent="生成に失敗しました。Safariを最新版にし、空きメモリを確保して再試行してください。長文の場合は短く分割してください。"}finally{$("progress").classList.add("hidden");$("generate").disabled=false}});

function splitText(s,max=120){const units=s.replace(/\r/g,"").split(/(?<=[。！？!?\n])/).filter(x=>x.trim());const out=[];for(const u0 of units){let u=u0.trim();while(u.length>max){let p=Math.max(u.lastIndexOf("、",max),u.lastIndexOf(" ",max));if(p<max*.45)p=max;out.push(u.slice(0,p+1));u=u.slice(p+1).trim()}if(u)out.push(u)}return out.length?out:[s]}
function mergeWavs(buffers){if(buffers.length===1)return new Blob([buffers[0]],{type:"audio/wav"});const parsed=buffers.map(parseWav);const a=parsed[0];for(const p of parsed){if(p.sampleRate!==a.sampleRate||p.channels!==a.channels||p.bits!==a.bits)throw new Error("音声形式が一致しません")}const total=parsed.reduce((n,p)=>n+p.data.byteLength,0);const out=new ArrayBuffer(44+total),v=new DataView(out);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,"RIFF");v.setUint32(4,36+total,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,a.channels,true);v.setUint32(24,a.sampleRate,true);const br=a.sampleRate*a.channels*a.bits/8;v.setUint32(28,br,true);v.setUint16(32,a.channels*a.bits/8,true);v.setUint16(34,a.bits,true);w(36,"data");v.setUint32(40,total,true);let pos=44;for(const p of parsed){new Uint8Array(out,pos,p.data.byteLength).set(new Uint8Array(p.data));pos+=p.data.byteLength}return new Blob([out],{type:"audio/wav"})}
function parseWav(buf){const v=new DataView(buf);const str=(o,n)=>String.fromCharCode(...new Uint8Array(buf,o,n));if(str(0,4)!=="RIFF"||str(8,4)!=="WAVE")throw new Error("WAV形式を解析できません");let o=12,fmt=null,data=null;while(o+8<=buf.byteLength){const id=str(o,4),n=v.getUint32(o+4,true),start=o+8;if(id==="fmt ")fmt={channels:v.getUint16(start+2,true),sampleRate:v.getUint32(start+4,true),bits:v.getUint16(start+14,true)};if(id==="data"){data=buf.slice(start,start+n);break}o=start+n+(n%2)}if(!fmt||!data)throw new Error("WAVデータが不完全です");return {...fmt,data}}
</script>
</main></body></html>
