<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAU / Voice Studio</title><meta name="description" content="まうが、あなたの声に合わせて動く。マイクと録音音声に対応したアバター試作品。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">MAU<span>/ VOICE STUDIO</span></a><span class="badge">PROTOTYPE 01</span></header><main><section class="stage" aria-label="キャラクタープレビュー"><div class="stage-top"><span>まう <small>TRACKSUIT</small></span><span id="state" role="status">待機中</span></div><div class="portrait"><canvas id="avatar" width="800" height="800" aria-label="音声に合わせて動くまう"></canvas></div><div class="stage-bottom"><span id="caption">声を聞かせて。</span><button id="demo" class="subtle">動きを試す</button></div></section><aside><div class="intro"><p class="eyebrow">VOICE → MOTION</p><h1>声で、動く。</h1><p>話すと口パク。静かになったら、ひと休み。</p></div><div class="tabs" role="tablist" aria-label="音声入力"><button id="micTab" role="tab" aria-selected="true" aria-controls="micPanel">マイク</button><button id="fileTab" role="tab" aria-selected="false" aria-controls="filePanel" tabindex="-1">録音音声</button></div><section id="micPanel" role="tabpanel" aria-labelledby="micTab"><h2>あなたの声に合わせる</h2><p>マイクをオンにして話しかけてください。</p><button id="mic" class="primary">マイクをオン</button><p class="note">初回はブラウザでマイクの使用を許可してください。スピーカーへの折り返しはありません。</p></section><section id="filePanel" role="tabpanel" aria-labelledby="fileTab" hidden><h2>録音した声に合わせる</h2><label class="filebox" for="file"><strong>音声ファイルを選ぶ</strong><span>MP3・WAV・M4Aなど</span><input id="file" type="file" accept="audio/*"></label><p id="filename" class="note">ファイルはまだ選ばれていません</p><audio id="audio" controls preload="metadata"></audio></section><div class="level-head"><label for="level">音声レベル</label><span id="levelText">0%</span></div><meter id="level" min="0" max="1" value="0">0</meter><div class="setting"><label for="sensitivity">口パクの感度</label><output id="sensitivityValue">1.5×</output><input id="sensitivity" type="range" min="0.5" max="4" step="0.1" value="1.5"></div><label class="check"><input id="motion" type="checkbox" checked>まばたき・体の揺れ</label><p id="message" role="status" class="message">音声はこのブラウザ内で処理されます。</p><footer>音量で口を開閉する2D試作です。<br>Live2D形式の完成モデルではありません。</footer></aside></main><script src="app.js"></script></body></html>
