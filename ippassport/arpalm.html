<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>IP PASSPORT — AR CAMERA</title>
<meta name="theme-color" content="#08090b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff2f92'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#08090b;--fg:#f2f2ee;--muted:#a7a9b0;--accent:#ff2f92;--cyan:#00e5e5;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --f-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--fg);font-family:var(--f-jp);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overflow:hidden
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- ステージ ---------- */
#stage{position:fixed;inset:0}
#view{width:100%;height:100%;display:block;background:#000}
#cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- 状態表示 ---------- */
#hud{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;max-width:90vw;
  padding:10px 16px;border-radius:999px;background:#08090bcc;border:1px solid #ffffff2e;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font:500 12px var(--f-mono);letter-spacing:.06em;white-space:nowrap;
  transition:opacity .3s
}
#hud .led{width:8px;height:8px;border-radius:50%;background:#6a6d74;flex:none;transition:background .25s}
#hud.ok .led{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#hud.warn .led{background:var(--accent);box-shadow:0 0 10px var(--accent)}
#hud.hide{opacity:0}

/* ---------- 下部コントロール ---------- */
#ui{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:16px max(16px,4vw) calc(var(--safe-b) + 18px);
  background:linear-gradient(#08090b00,#08090bd9 42%);
  display:flex;flex-direction:column;gap:16px;align-items:center
}
.chars{display:flex;gap:10px}
.chars button{
  width:60px;min-height:60px;padding:7px 4px 8px;border-radius:14px;
  border:1px solid #ffffff26;background:#12131899;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font:500 10px var(--f-mono);letter-spacing:.08em;color:var(--muted);
  transition:border-color .2s,color .2s,transform .2s
}
.chars img{width:30px;height:30px;object-fit:contain;object-position:top}
.chars button[aria-pressed="true"]{border-color:var(--accent);color:#fff;transform:translateY(-3px);box-shadow:0 0 18px #ff2f9240}

.row{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
.icon-btn{
  width:56px;height:56px;border-radius:50%;border:1px solid #ffffff2e;background:#12131899;
  display:grid;place-items:center;font:500 10px var(--f-mono);letter-spacing:.05em;color:var(--fg);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center;line-height:1.25
}
.icon-btn:active{border-color:var(--accent)}
#shutter{
  width:78px;height:78px;border-radius:50%;border:3px solid #fff;background:#ffffff1f;
  display:grid;place-items:center;transition:transform .12s
}
#shutter::after{content:"";width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s}
#shutter:active{transform:scale(.94)}
#shutter:active::after{transform:scale(.88)}
#modeBtn{min-width:112px;width:auto;height:44px;border-radius:22px;padding:0 16px;font-size:11px}

/* ---------- 起動ゲート ---------- */
#gate{
  position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 38%,#241f2b,#08090b 62%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:40px max(24px,6vw) calc(var(--safe-b) + 40px);gap:0
}
#gate .tag{font:500 11px var(--f-mono);letter-spacing:.24em;color:var(--accent);margin:0}
#gate h1{font:800 clamp(30px,9vw,46px)/1.02 system-ui,-apple-system,sans-serif;letter-spacing:-.045em;margin:20px 0 0}
#gate p{font-size:14px;line-height:1.95;color:var(--muted);margin:22px 0 0;max-width:30em}
#gate ol{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:10px;text-align:left;max-width:22em;width:100%}
#gate li{display:flex;gap:12px;font-size:13px;line-height:1.7;color:var(--muted)}
#gate li b{color:var(--accent);font:500 12px var(--f-mono);flex:none;padding-top:2px}
#startBtn{
  margin-top:38px;min-height:62px;width:min(330px,86vw);
  border:1px solid var(--fg);background:#09090b99;
  display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px;
  font:600 13px var(--f-mono);letter-spacing:.13em;transition:background .2s,border-color .2s
}
#startBtn:active{background:var(--accent);border-color:var(--accent)}
#gateNote{font:500 11px/1.7 var(--f-mono);color:#8d9099;margin-top:20px;letter-spacing:.04em}
#gateNote.err{color:var(--accent)}

/* ---------- 撮影結果 ---------- */
#shot{
  position:fixed;inset:0;z-index:30;background:#08090bf5;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 5vw calc(var(--safe-b) + 24px)
}
#shot.on{display:flex}
#shotImg{max-width:100%;max-height:64vh;border:1px solid #ffffff2e;object-fit:contain}
#shot .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#shot .acts button{
  min-height:52px;padding:0 22px;border:1px solid #ffffff40;
  font:600 12px var(--f-mono);letter-spacing:.11em
}
#shot .acts .primary{border-color:var(--accent);color:var(--accent)}

/* ---------- トースト ---------- */
#toast{
  position:fixed;z-index:40;left:50%;bottom:calc(var(--safe-b) + 210px);transform:translate(-50%,10px);
  padding:12px 20px;border-radius:999px;background:#12131fee;border:1px solid #ffffff2e;
  font:500 12px var(--f-mono);letter-spacing:.05em;opacity:0;pointer-events:none;transition:.25s
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="view"></canvas>
</div>

<div id="hud" hidden><span class="led"></span><span id="hudText">起動中…</span></div>

<div id="ui" hidden>
  <div class="chars" id="chars" role="group" aria-label="キャラクター選択"></div>
  <div class="row">
    <button class="icon-btn" id="modeBtn" aria-label="モード切替">手のひら</button>
    <button id="shutter" aria-label="撮影"></button>
    <button class="icon-btn" id="flipBtn" aria-label="カメラ切替">前/後</button>
  </div>
</div>

<div id="gate">
  <p class="tag">IP PASSPORT / AR CAMERA</p>
  <h1>手のひらに、<br>キャラクターを。</h1>
  <p>カメラに手のひらを向けると、そこにキャラクターが立ちます。撮影した写真は端末に保存できます。</p>
  <ol>
    <li><b>01</b>カメラの使用を許可してください</li>
    <li><b>02</b>手のひらを開いてカメラに向けます</li>
    <li><b>03</b>明るい場所ほど安定します</li>
  </ol>
  <button id="startBtn"><span>START AR</span><span aria-hidden="true">↗</span></button>
  <p id="gateNote">映像は端末内で処理され、どこにも送信されません。</p>
</div>

<div id="shot" role="dialog" aria-modal="true" aria-label="撮影結果">
  <img id="shotImg" alt="撮影した写真">
  <div class="acts">
    <button id="saveBtn" class="primary">保存 / シェア</button>
    <button id="closeShot">閉じる</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

const MP_VER='1.0.1';
const MP_MJS=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`;
const MP_WASM=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`;
const MP_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $=s=>document.querySelector(s);
const video=$('#cam'), canvas=$('#view'), ctx=canvas.getContext('2d');
const hud=$('#hud'), hudText=$('#hudText'), ui=$('#ui'), gate=$('#gate'), note=$('#gateNote');

let dpr=1, W=0, H=0;
let facing='environment', stream=null, landmarker=null;
let mode='palm';                 // 'palm' | 'place'
let current=0;
let images=[];
let hand=null, lastHandAt=0;     // 直近の検出結果と時刻
const sm={x:0,y:0,s:0,rot:0,init:false};
const place={x:.5,y:.72,s:.42};  // 置きモードの位置（正規化）とサイズ
let palmScale=1;                 // 手のひらモードの大きさ倍率（ピンチで調整）
let started=false;

/* ---------- 画像の読み込み ---------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
images=await Promise.all(CHARS.map(c=>loadImg(c.src)));

/* ---------- キャラクター選択UI ---------- */
const charsEl=$('#chars');
CHARS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.type='button'; b.setAttribute('aria-pressed', String(i===0));
  b.innerHTML=`<img src="${c.src}" alt=""><span>${c.en}</span>`;
  b.addEventListener('click',()=>{
    current=i;
    [...charsEl.children].forEach((el,j)=>el.setAttribute('aria-pressed',String(j===i)));
    toast(c.name);
  });
  charsEl.appendChild(b);
});

/* ---------- 画面サイズ ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- 起動 ---------- */
$('#startBtn').addEventListener('click', start);

async function start(){
  if(!isSecure()){
    note.className='err';
    note.textContent='HTTPSで開く必要があります。file:// や http:// ではカメラを起動できません。';
    return;
  }
  note.className=''; note.textContent='カメラを起動しています…';
  try{ await openCamera(); }
  catch(e){
    note.className='err';
    note.textContent='カメラを起動できませんでした。ブラウザの設定でカメラを許可してください。';
    return;
  }
  gate.remove(); hud.hidden=false; ui.hidden=false; started=true;
  resize(); requestAnimationFrame(loop);
  setStatus('','手の検出を準備中…');
  try{ await initHands(); setStatus('ok','手のひらをカメラに向けてください'); }
  catch(e){
    mode='place'; $('#modeBtn').textContent='置く';
    setStatus('warn','手の検出を読み込めません。置くモードに切替');
    toast('タップで配置 / ピンチで拡大');
  }
}
const isSecure=()=>location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);

async function openCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false
  });
  video.srcObject=stream;
  await video.play();
}

async function initHands(){
  const {FilesetResolver, HandLandmarker}=await import(MP_MJS);
  const fileset=await FilesetResolver.forVisionTasks(MP_WASM);
  const opts={baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:1};
  try{ landmarker=await HandLandmarker.createFromOptions(fileset,opts); }
  catch(e){ opts.baseOptions.delegate='CPU'; landmarker=await HandLandmarker.createFromOptions(fileset,opts); }
}

/* ---------- 描画ループ ---------- */
let lastVideoTime=-1;
function loop(t){
  if(!started) return;
  requestAnimationFrame(loop);
  if(video.readyState<2||!W) return;

  const vw=video.videoWidth, vh=video.videoHeight;
  const scale=Math.max(W/vw,H/vh);
  const dw=vw*scale, dh=vh*scale, ox=(W-dw)/2, oy=(H-dh)/2;
  const mirror=(facing==='user');

  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(video,ox,oy,dw,dh);
  ctx.restore();

  if(mode==='palm'&&landmarker&&video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    try{
      const r=landmarker.detectForVideo(video,t);
      if(r.landmarks&&r.landmarks.length){ hand=r.landmarks[0]; lastHandAt=t; }
    }catch(e){}
  }

  // 正規化座標 → 画面座標（ミラー時はxを反転）
  const map=p=>({x:ox+(mirror?1-p.x:p.x)*dw, y:oy+p.y*dh});

  let target=null;
  if(mode==='palm'){
    const fresh=hand && (t-lastHandAt)<600;   // 一瞬のロストで消さない
    if(fresh){
      const ids=[0,5,9,13,17];
      const pts=ids.map(i=>map(hand[i]));
      const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length;
      const cy=pts.reduce((a,p)=>a+p.y,0)/pts.length;
      const a=map(hand[5]), b=map(hand[17]);
      const palmW=Math.hypot(a.x-b.x,a.y-b.y);
      const w=map(hand[0]), m=map(hand[9]);
      const rot=Math.atan2(m.x-w.x,-(m.y-w.y))*0.35;   // 手の傾きを控えめに反映
      target={x:cx, y:cy+palmW*0.10, s:palmW*2.6*palmScale, rot};
      setStatus('ok','TRACKING / ピンチでサイズ調整');
    }else{
      setStatus('warn','手のひらをカメラに向けてください');
    }
  }else{
    target={x:place.x*W, y:place.y*H, s:place.s*Math.min(W,H)*1.6, rot:0};
    setStatus('ok','タップで移動 / ピンチで拡大');
  }

  if(target){
    if(!sm.init){ Object.assign(sm,target); sm.init=true; }
    const k=(mode==='palm')?0.30:0.5;
    sm.x+=(target.x-sm.x)*k; sm.y+=(target.y-sm.y)*k;
    sm.s+=(target.s-sm.s)*k; sm.rot+=(target.rot-sm.rot)*k;
    drawChar(sm,t);
  }
}

function drawChar(p,t){
  const img=images[current], tint=CHARS[current].tint;
  const h=Math.max(40,p.s), w=h*img.width/img.height;
  const bob=Math.sin(t/620)*h*0.018;

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.rot);

  // 接地感を出す影とリング
  ctx.save();
  ctx.scale(1,0.30);
  const g=ctx.createRadialGradient(0,0,0,0,0,w*0.62);
  g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,w*0.62,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha=0.30+0.16*Math.sin(t/500);
  ctx.strokeStyle=tint; ctx.lineWidth=Math.max(1.2,h*0.006);
  ctx.beginPath(); ctx.ellipse(0,0,w*0.40,w*0.13,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.shadowColor=tint; ctx.shadowBlur=h*0.10;
  ctx.drawImage(img,-w/2,-h+bob,w,h);
  ctx.restore();
}

function drawMark(c){
  const g=c.getContext('2d'), k=c.width/900;
  g.save();
  g.globalAlpha=.8; g.fillStyle='#f2f2ee';
  g.font=`500 ${Math.round(20*k)}px ui-monospace,Menlo,monospace`;
  g.textAlign='right'; g.textBaseline='bottom';
  g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=8*k;
  g.fillText('IP PASSPORT / AR', c.width-28*k, c.height-28*k);
  g.restore();
}

/* ---------- 置くモードの操作 ---------- */
let pinch0=0, base=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch0=dist(e.touches); base=(mode==='place')?place.s:palmScale;
  }else if(e.touches.length===1&&mode==='place'){
    setPlace(e.touches[0]);
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinch0){
    const r=dist(e.touches)/pinch0;
    if(mode==='place') place.s=clamp(base*r,.12,1.6);
    else palmScale=clamp(base*r,.5,2.2);
  }else if(e.touches.length===1&&mode==='place'){
    setPlace(e.touches[0]);
  }
},{passive:true});
canvas.addEventListener('touchend',()=>{pinch0=0;},{passive:true});
canvas.addEventListener('click',e=>{ if(mode==='place') setPlace(e); });
const dist=ts=>Math.hypot(ts[0].clientX-ts[1].clientX, ts[0].clientY-ts[1].clientY);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function setPlace(p){
  const r=canvas.getBoundingClientRect();
  place.x=clamp((p.clientX-r.left)/r.width,.05,.95);
  place.y=clamp((p.clientY-r.top)/r.height,.15,.98);
}

/* ---------- ボタン ---------- */
$('#modeBtn').addEventListener('click',()=>{
  if(mode==='palm'&&!landmarker){ toast('手の検出が利用できません'); }
  mode = mode==='palm' ? 'place' : 'palm';
  $('#modeBtn').textContent = mode==='palm' ? '手のひら' : '置く';
  sm.init=false;
  toast(mode==='palm' ? '手のひらモード' : 'タップで配置 / ピンチで拡大');
});

$('#flipBtn').addEventListener('click',async()=>{
  facing = facing==='environment' ? 'user' : 'environment';
  try{ await openCamera(); toast(facing==='user'?'フロントカメラ':'背面カメラ'); }
  catch(e){ toast('切替できませんでした'); }
});

$('#shutter').addEventListener('click',()=>{
  const out=document.createElement('canvas');
  out.width=canvas.width; out.height=canvas.height;
  out.getContext('2d').drawImage(canvas,0,0);
  drawMark(out);
  out.toBlob(b=>{
    if(!b) return toast('保存に失敗しました');
    shotBlob=b;
    $('#shotImg').src=URL.createObjectURL(b);
    $('#shot').classList.add('on');
  },'image/jpeg',0.94);
  flash();
});

let shotBlob=null;
$('#saveBtn').addEventListener('click',async()=>{
  if(!shotBlob) return;
  const file=new File([shotBlob],`ip-passport-ar-${Date.now()}.jpg`,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(shotBlob); a.download=file.name; a.click();
  toast('保存しました');
});
$('#closeShot').addEventListener('click',()=>$('#shot').classList.remove('on'));

/* ---------- 補助 ---------- */
function setStatus(cls,text){
  if(hudText.textContent!==text) hudText.textContent=text;
  hud.className=cls;
}
let toastT;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1600);
}
function flash(){
  const f=document.createElement('div');
  f.style.cssText='position:fixed;inset:0;background:#fff;z-index:25;pointer-events:none;transition:opacity .28s';
  document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.opacity='0';});
  setTimeout(()=>f.remove(),320);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&video.paused) video.play().catch(()=>{}); });
</script>
