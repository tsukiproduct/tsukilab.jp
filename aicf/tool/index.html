<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICF Blind Review</title><style>body{margin:0;background:#101827;color:#edf2ff;font:16px/1.6 system-ui}.wrap{max-width:780px;margin:auto;padding:22px}section{background:#1c2940;padding:20px;border-radius:15px;margin:18px 0}select,input,textarea{box-sizing:border-box;width:100%;padding:12px;background:#101827;color:white;border:1px solid #54627a;border-radius:9px;font:inherit}textarea{min-height:120px}button{padding:10px 13px;margin:7px 5px 0 0;background:#93afff;border:0;border-radius:8px;font-weight:bold}video{width:100%;max-height:70vh;background:#05070a}small{color:#aab9d0}h1{font-size:25px}h2{font-size:18px}</style><div class="wrap"><h1>AICF / BLIND REVIEW</h1><small>作者名・アカウント・X投稿画面を表示しない審査ビューア</small><section><select id="work"></select><p id="category"></p><video id="player" controls playsinline preload="metadata" webkit-playsinline></video><div><button id="openVideo" type="button" style="display:none">動画を直接開いて再生</button></div><p id="status"></p><button id="prev">前へ</button><button id="next">次へ</button><button id="refresh">動画URLを再読込</button><details><summary>直接MP4 URLを設定（この端末のみ）</summary><input id="direct" placeholder="https://video.twimg.com/...mp4"><button id="set">設定</button></details></section><section><h2>応募作品の説明</h2><p id="description" style="white-space:pre-wrap"></p><h2>使用ツール</h2><p id="tools"></p></section><section><h2>作品レビュー</h2><textarea id="review"></textarea><h2>技術・制作面のレビュー</h2><textarea id="technical"></textarea><button id="export">レビューをJSON保存</button><small><p>レビューはブラウザ内に自動保存。別端末とは同期されません。定期的に書き出してください。</p></small></section><small>動画内の透かしやクレジットは非表示にできません。X側の制限やURLの期限切れで再生できない場合があります。公開ページのため機密情報は記入しないでください。</small></div><script>
const $=id=>document.getElementById(id);let works=[],media={},index=0,notes=JSON.parse(localStorage.getItem('aicf-notes')||'{}'),manual=JSON.parse(localStorage.getItem('aicf-manual')||'{}');function show(){const w=works[index];if(!w)return;$('work').value=w.id;$('category').textContent=w.category;$('description').textContent=w.description;$('tools').textContent=w.tools;$('review').value=notes[w.id]?.review||'';$('technical').value=notes[w.id]?.technical||'';const u=manual[w.id]||media[w.id]?.url;const directButton=$('openVideo');directButton.style.display=u?'inline-block':'none';directButton.onclick=()=>{if(u)window.open(u,'_blank','noopener')};$('player').pause();$('player').removeAttribute('src');$('player').load();if(u&&u.startsWith('https://')){$('player').src=u;$('player').load();$('status').textContent='動画を読み込み中… 再生できない場合は「動画を直接開いて再生」を押してください。'}else{$('status').textContent=media[w.id]?.error||'動画URL未取得。GitHub Actionsの実行を待っています。'}}function move(i){index=Math.max(0,Math.min(works.length-1,i));show()}$('work').onchange=()=>move(works.findIndex(w=>w.id===$('work').value));$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);for(const key of ['review','technical'])$(key).oninput=()=>{let id=works[index].id;notes[id]??={};notes[id][key]=$(key).value;localStorage.setItem('aicf-notes',JSON.stringify(notes))};$('set').onclick=()=>{let u=$('direct').value.trim();if(!u.startsWith('https://'))return alert('HTTPS URLを入力してください');manual[works[index].id]=u;localStorage.setItem('aicf-manual',JSON.stringify(manual));show()};$('refresh').onclick=async()=>{media=await(await fetch('media.json?'+Date.now(),{cache:'no-store'})).json();show()};$('player').onloadedmetadata=()=>$('status').textContent='動画を読み込みました。再生ボタンを押してください。';$('player').onerror=()=>$('status').textContent='ページ内で再生できません。下の「動画を直接開いて再生」から視聴してください。';$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}));a.download='aicf-review.json';a.click()};(async()=>{works=await(await fetch('works.json')).json();media=await(await fetch('media.json?'+Date.now(),{cache:'no-store'})).json();$('work').innerHTML=works.map(w=>'<option>'+w.id+'</option>').join('');show()})().catch(e=>$('status').textContent='読み込みエラー: '+e.message);
</script></html>
